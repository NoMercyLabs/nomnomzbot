name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nomercylabs/nomnomzbot

# Cancel an in-progress run when a newer commit lands on the same ref (or a PR gets a new push):
# no point burning an image build on a commit that's already been superseded. Grouped
# by ref so master pushes cancel prior master runs and each PR cancels only its own earlier run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (backend)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # global.json pins 10.0.0 with rollForward=latestMajor; install the latest 10.0 patch by channel
          # (an exact "10.0.0" lookup 404s on the install feed) and let global.json roll forward to it.
          dotnet-version: '10.0.x'

      - name: Restore .NET tools (CSharpier)
        working-directory: server
        run: dotnet tool restore

      - name: Verify formatting (CSharpier)
        working-directory: server
        run: dotnet csharpier check .

      # The script and widget builds run the real esbuild binary in tests. Same pinned version as the Dockerfile.
      - name: Install esbuild
        env:
          ESBUILD_VERSION: '0.28.1'
        run: |
          curl -fsSL "https://registry.npmjs.org/@esbuild/linux-x64/-/linux-x64-${ESBUILD_VERSION}.tgz" -o "$RUNNER_TEMP/esbuild.tgz"
          tar -xzf "$RUNNER_TEMP/esbuild.tgz" -C "$RUNNER_TEMP" package/bin/esbuild
          sudo install -m 0755 "$RUNNER_TEMP/package/bin/esbuild" /usr/local/bin/esbuild
          esbuild --version

      - name: Build
        working-directory: server
        run: dotnet build NomNomzBot.slnx -c Debug

      - name: Test
        working-directory: server
        run: dotnet test NomNomzBot.slnx -c Debug --no-build

      # A red here means the run can never deploy: cancel the sibling job instead of letting it burn minutes.
      - name: Stop the run early
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  # The Vue dashboard: type check, lint, unit tests, production build, and the API contract check that
  # replaces the old KMP contract test (the committed API types must match server/openapi/v1.json).
  dashboard:
    name: Dashboard (Vue)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      # Regenerates src/api/schema.d.ts from the committed snapshot; any difference means the types were
      # not regenerated after a contract change (run `npm run gen:api` in dashboard/ and commit it).
      - name: API types match server/openapi/v1.json
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx vitest run

      # No production build here: the image build runs the same `npm run build-only` in its Node stage, next to
      # this job, so a second build would be the same work twice.

      - name: Stop the run early
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  # Builds the image next to the tests, not after them (the tests used to hold it back 13 minutes). It pushes only
  # the immutable sha tag: nothing runs from that tag but the lite check. The moving tags (branch, latest), which
  # the deploy pulls, are put on this same image by the publish job once the tests and the dashboard checks pass,
  # so no work is done twice and an untested build never becomes `latest`.
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stamps the commit into the image so /health/version reports WHICH build is live. Without
          # this, every image reports the static "0.1.0" and no one can tell a fresh deploy from a
          # stale one — the deploy job going green is not evidence the box is running that commit.
          build-args: |
            GIT_SHA=${{ github.sha }}
          # The dashboard-build stage only re-runs when dashboard/ changes. The GHA cache alone is capped at
          # 10 GB and evicts big layers, so C#-only commits would rebuild the dashboard; the registry cache in
          # GHCR is not evicted.
          cache-from: |
            type=registry,ref=ghcr.io/${{ env.IMAGE_NAME }}:buildcache
            type=gha
          cache-to: |
            ${{ github.event_name == 'push' && format('type=registry,ref=ghcr.io/{0}:buildcache,mode=max', env.IMAGE_NAME) || '' }}
            type=gha,mode=max

  # Puts the moving tags on the image the build job already pushed, once the tests and the dashboard checks have
  # passed. A registry tag copy: no rebuild, a few seconds. The deploy pulls `latest`, so this is its gate.
  publish:
    name: Publish image tags
    needs: [test, dashboard, build]
    if: >
      !cancelled() &&
      needs.test.result == 'success' &&
      needs.dashboard.result == 'success' &&
      needs.build.result == 'success' &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the tested image
        run: |
          set -eu
          short=$(echo "${{ github.sha }}" | cut -c1-7)
          image="ghcr.io/${{ env.IMAGE_NAME }}"
          tags="-t ${image}:${{ github.ref_name }}"
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            tags="${tags} -t ${image}:latest"
          fi
          docker buildx imagetools create ${tags} "${image}:sha-${short}"

  # Proves the SQLite-only Docker install (docker-compose.lite.yml): boots on the image the build job just
  # pushed, writes a row through the API, restarts the container, and checks the row survived on the volume.
  lite:
    name: Docker lite (SQLite) restart check
    needs: build
    if: >
      !cancelled() &&
      needs.build.result == 'success' &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    env:
      API_HTTP_PORT: '5080'
      COMPOSE_PROJECT_NAME: nnzlite
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start the lite stack
        run: |
          set -eu
          short=$(echo "${{ github.sha }}" | cut -c1-7)
          export API_IMAGE="ghcr.io/${{ env.IMAGE_NAME }}:sha-${short}"
          echo "API_IMAGE=${API_IMAGE}" >> "$GITHUB_ENV"
          docker compose -f docker-compose.lite.yml up -d --no-build --pull always
          docker compose -f docker-compose.lite.yml ps
          docker compose -f docker-compose.lite.yml config --services | grep -qx api
          if docker compose -f docker-compose.lite.yml config --services | grep -Eq 'postgres|redis'; then
            echo "lite stack must not define postgres or redis"; exit 1
          fi

      - name: Wait for ready and onboarding is not done
        run: |
          set -eu
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5080/health/ready || true)
            [ "$code" = "200" ] && break
            sleep 3
          done
          [ "$code" = "200" ] || { docker compose -f docker-compose.lite.yml logs --tail=100; exit 1; }
          body=$(curl -sf http://localhost:5080/api/v1/system/status)
          echo "$body"
          echo "$body" | grep -Eqi '"onboardingComplete": ?false'

      - name: Write rows through the API
        run: |
          set -eu
          curl -sf -X PUT http://localhost:5080/api/v1/system/setup/credentials/twitch \
            -H 'Content-Type: application/json' \
            -d '{"clientId":"ci-lite-marker-client","clientSecret":"ci-lite-marker-secret","botUsername":"ci_lite_bot"}'
          curl -sf -X POST http://localhost:5080/api/v1/system/setup/credentials/twitch/use-shared
          body=$(curl -sf http://localhost:5080/api/v1/system/status)
          echo "$body"
          echo "$body" | grep -Eqi '"onboardingComplete": ?true'
          # A saved secret is encrypted under the generated key; "ready_redirect" means it was stored and read back.
          echo "$body" | grep -q 'ready_redirect'
          docker compose -f docker-compose.lite.yml exec -T api test -s /app/data/keys/root-kek.key

      - name: Restart the container
        run: |
          set -eu
          docker compose -f docker-compose.lite.yml restart api
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5080/health/ready || true)
            [ "$code" = "200" ] && break
            sleep 3
          done
          [ "$code" = "200" ] || { docker compose -f docker-compose.lite.yml logs --tail=100; exit 1; }

      - name: Prove the data survived the restart
        run: |
          set -eu
          body=$(curl -sf http://localhost:5080/api/v1/system/status)
          echo "$body"
          echo "$body" | grep -Eqi '"onboardingComplete": ?true'
          # The saved secret still decrypts after the restart, so the generated key was kept.
          echo "$body" | grep -q 'ready_redirect'
          # The listing is for the log only: SQLite can drop its -wal file mid-listing, so a vanished file must not fail the run.
          docker compose -f docker-compose.lite.yml exec -T api ls -la /app/data /app/data/keys || true

      - name: Prove the data survives removing the container
        run: |
          set -eu
          docker compose -f docker-compose.lite.yml down
          docker compose -f docker-compose.lite.yml up -d --no-build
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5080/health/ready || true)
            [ "$code" = "200" ] && break
            sleep 3
          done
          [ "$code" = "200" ]
          body=$(curl -sf http://localhost:5080/api/v1/system/status)
          echo "$body" | grep -Eqi '"onboardingComplete": ?true'
          echo "$body" | grep -q 'ready_redirect'

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.lite.yml logs --tail=200

      - name: Clean up
        if: always()
        run: docker compose -f docker-compose.lite.yml down -v

  # No deploy here: the hosted server runs stable only. release.yml deploys it through deploy.yml.
