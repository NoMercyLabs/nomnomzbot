name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nomercylabs/nomnomzbot

# Cancel an in-progress run when a newer commit lands on the same ref (or a PR gets a new push):
# no point burning a ~25-minute Wasm image build on a commit that's already been superseded. Grouped
# by ref so master pushes cancel prior master runs and each PR cancels only its own earlier run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (backend)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # global.json pins 10.0.0 with rollForward=latestMajor; install the latest 10.0 patch by channel
          # (an exact "10.0.0" lookup 404s on the install feed) and let global.json roll forward to it.
          dotnet-version: '10.0.x'

      - name: Restore .NET tools (CSharpier)
        working-directory: server
        run: dotnet tool restore

      - name: Verify formatting (CSharpier)
        working-directory: server
        run: dotnet csharpier check .

      # The script and widget builds run the real esbuild binary in tests. Same pinned version as the Dockerfile.
      - name: Install esbuild
        env:
          ESBUILD_VERSION: '0.28.1'
        run: |
          curl -fsSL "https://registry.npmjs.org/@esbuild/linux-x64/-/linux-x64-${ESBUILD_VERSION}.tgz" -o "$RUNNER_TEMP/esbuild.tgz"
          tar -xzf "$RUNNER_TEMP/esbuild.tgz" -C "$RUNNER_TEMP" package/bin/esbuild
          sudo install -m 0755 "$RUNNER_TEMP/package/bin/esbuild" /usr/local/bin/esbuild
          esbuild --version

      - name: Build
        working-directory: server
        run: dotnet build NomNomzBot.slnx -c Debug

      - name: Test
        working-directory: server
        run: dotnet test NomNomzBot.slnx -c Debug --no-build

      # A red here means the run can never deploy: cancel the sibling job instead of letting it burn minutes.
      - name: Stop the run early
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  # The Vue dashboard: type check, lint, unit tests, production build, and the API contract check that
  # replaces the old KMP contract test (the committed API types must match server/openapi/v1.json).
  dashboard:
    name: Dashboard (Vue)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      # Regenerates src/api/schema.d.ts from the committed snapshot; any difference means the types were
      # not regenerated after a contract change (run `npm run gen:api` in dashboard/ and commit it).
      - name: API types match server/openapi/v1.json
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build-only

      - name: Stop the run early
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  build:
    name: Build & push image
    needs: [test, dashboard]
    if: >
      !cancelled() &&
      needs.test.result == 'success' &&
      needs.dashboard.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stamps the commit into the image so /health/version reports WHICH build is live. Without
          # this, every image reports the static "0.1.0" and no one can tell a fresh deploy from a
          # stale one — the deploy job going green is not evidence the box is running that commit.
          build-args: |
            GIT_SHA=${{ github.sha }}
          # The dashboard-build stage only re-runs when dashboard/ changes. The GHA cache alone is capped at
          # 10 GB and evicts big layers, so C#-only commits would rebuild the dashboard; the registry cache in
          # GHCR is not evicted.
          cache-from: |
            type=registry,ref=ghcr.io/${{ env.IMAGE_NAME }}:buildcache
            type=gha
          cache-to: |
            ${{ github.event_name == 'push' && format('type=registry,ref=ghcr.io/{0}:buildcache,mode=max', env.IMAGE_NAME) || '' }}
            type=gha,mode=max

  # Proves the SQLite-only Docker install (docker-compose.lite.yml): boots on the image the build job just
  # pushed, writes a row through the API, restarts the container, and checks the row survived on the volume.
  lite:
    name: Docker lite (SQLite) restart check
    needs: build
    if: >
      !cancelled() &&
      needs.build.result == 'success' &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    env:
      API_HTTP_PORT: '5080'
      COMPOSE_PROJECT_NAME: nnzlite
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start the lite stack
        run: |
          set -eu
          short=$(echo "${{ github.sha }}" | cut -c1-7)
          export API_IMAGE="ghcr.io/${{ env.IMAGE_NAME }}:sha-${short}"
          echo "API_IMAGE=${API_IMAGE}" >> "$GITHUB_ENV"
          docker compose -f docker-compose.lite.yml up -d --no-build --pull always
          docker compose -f docker-compose.lite.yml ps
          docker compose -f docker-compose.lite.yml config --services | grep -qx api
          if docker compose -f docker-compose.lite.yml config --services | grep -Eq 'postgres|redis'; then
            echo "lite stack must not define postgres or redis"; exit 1
          fi

      - name: Wait for ready and onboarding is not done
        run: |
          set -eu
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5080/health/ready || true)
            [ "$code" = "200" ] && break
            sleep 3
          done
          [ "$code" = "200" ] || { docker compose -f docker-compose.lite.yml logs --tail=100; exit 1; }
          body=$(curl -sf http://localhost:5080/api/v1/system/status)
          echo "$body"
          echo "$body" | grep -Eqi '"onboardingComplete": ?false'

      - name: Write rows through the API
        run: |
          set -eu
          curl -sf -X PUT http://localhost:5080/api/v1/system/setup/credentials/twitch \
            -H 'Content-Type: application/json' \
            -d '{"clientId":"ci-lite-marker-client","clientSecret":"ci-lite-marker-secret","botUsername":"ci_lite_bot"}'
          curl -sf -X POST http://localhost:5080/api/v1/system/setup/credentials/twitch/use-shared
          body=$(curl -sf http://localhost:5080/api/v1/system/status)
          echo "$body"
          echo "$body" | grep -Eqi '"onboardingComplete": ?true'
          # A saved secret is encrypted under the generated key; "ready_redirect" means it was stored and read back.
          echo "$body" | grep -q 'ready_redirect'
          docker compose -f docker-compose.lite.yml exec -T api test -s /app/data/keys/root-kek.key

      - name: Restart the container
        run: |
          set -eu
          docker compose -f docker-compose.lite.yml restart api
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5080/health/ready || true)
            [ "$code" = "200" ] && break
            sleep 3
          done
          [ "$code" = "200" ] || { docker compose -f docker-compose.lite.yml logs --tail=100; exit 1; }

      - name: Prove the data survived the restart
        run: |
          set -eu
          body=$(curl -sf http://localhost:5080/api/v1/system/status)
          echo "$body"
          echo "$body" | grep -Eqi '"onboardingComplete": ?true'
          # The saved secret still decrypts after the restart, so the generated key was kept.
          echo "$body" | grep -q 'ready_redirect'
          docker compose -f docker-compose.lite.yml exec -T api ls -la /app/data /app/data/keys

      - name: Prove the data survives removing the container
        run: |
          set -eu
          docker compose -f docker-compose.lite.yml down
          docker compose -f docker-compose.lite.yml up -d --no-build
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5080/health/ready || true)
            [ "$code" = "200" ] && break
            sleep 3
          done
          [ "$code" = "200" ]
          body=$(curl -sf http://localhost:5080/api/v1/system/status)
          echo "$body" | grep -Eqi '"onboardingComplete": ?true'
          echo "$body" | grep -q 'ready_redirect'

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.lite.yml logs --tail=200

      - name: Clean up
        if: always()
        run: docker compose -f docker-compose.lite.yml down -v

  deploy:
    name: Deploy to server
    needs: build
    # DEPLOY_HOST is a private-LAN address (Proxmox) — a GitHub-hosted runner cannot reach it at all
    # ("dial tcp ***:22: i/o timeout"), so this runs on the self-hosted runner living on that same LAN
    # (registered with the nomnomzbot-deploy label). That runner container has no docker socket or
    # /opt/nomnomzbot mounted into it, so it still deploys over SSH exactly as before — the only change
    # is WHERE the SSH client runs, from a network that can actually reach the host.
    runs-on: [self-hosted, nomnomzbot-deploy]
    # Only deploy on master pushes, and only when the DEPLOY_HOST secret is configured.
    # To enable: add DEPLOY_HOST (server IP/hostname) and DEPLOY_SSH_KEY (private key) as
    # repository secrets, and make sure the server can pull from ghcr.io/nomercylabs/nomnomzbot.
    if: >
      !cancelled() &&
      needs.build.result == 'success' &&
      github.ref == 'refs/heads/master' &&
      github.event_name == 'push' &&
      vars.DEPLOY_ENABLED == 'true'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # BLUE/GREEN. There is no `api` service: docker-compose.yml fronts TWO api-* services with
          # Caddy, which routes to whichever passes health (see scripts/switchover.ps1, the same
          # procedure this mirrors for the Linux/SSH deploy path). Deploying `api` failed with
          # "no such service: api" and left the box serving nothing.
          # set -e: a failed pull/up must fail the job, not silently fall through to the health poll.
          script: |
            set -e
            docker pull ghcr.io/nomercylabs/nomnomzbot:latest
            cd /opt/nomnomzbot
            # api-green is profiled so a bare `up -d` cannot start both colours; export the profile so
            # every compose call below can still address green explicitly.
            export COMPOSE_PROFILES=green

            # Which colour is live? Ask docker rather than tracking state, so a re-run after a failed
            # attempt converges instead of double-switching.
            ps_out=$(docker ps --filter name=nomnomzbot-api- --format '{{.Names}}' || true)
            blue_up=$(echo "$ps_out" | grep -c 'nomnomzbot-api-blue' || true)
            green_up=$(echo "$ps_out" | grep -c 'nomnomzbot-api-green' || true)

            if [ "$blue_up" -gt 0 ] && [ "$green_up" -gt 0 ]; then
              echo "Both api-blue and api-green are running — ambiguous state from a half-finished switchover."
              echo "Resolve manually (stop the one Caddy is NOT routing to) before deploying again."
              exit 1
            fi

            # Neither running (first deploy on this host) -> treat blue as live so we bring up green.
            if [ "$green_up" -gt 0 ]; then live=green; idle=blue; else live=blue; idle=green; fi
            echo "Live colour: api-$live -> deploying api-$idle"

            API_IMAGE=ghcr.io/nomercylabs/nomnomzbot:latest \
              docker compose up -d --no-deps --pull always "api-$idle"
            docker compose logs "api-$idle" --tail=20

            # Wait for the NEW colour's own /health/ready, in-container rather than through Caddy, so a
            # still-healthy old instance cannot make a broken new one look ready.
            ready=0
            for i in $(seq 1 30); do
              code=$(docker exec "nomnomzbot-api-$idle" curl -s -o /dev/null -w '%{http_code}' \
                http://localhost:5000/health/ready 2>/dev/null || echo "000")
              if [ "$code" = "200" ]; then
                echo "api-$idle ready after ${i}0s"
                ready=1
                break
              fi
              sleep 10
            done

            if [ "$ready" != "1" ]; then
              echo "api-$idle never passed /health/ready — leaving api-$live serving, nothing cut over."
              docker compose logs "api-$idle" --tail=100
              docker compose stop "api-$idle" || true
              exit 1
            fi

            # Only now drain the old colour. The app fails /health/ready on SIGTERM so Caddy stops
            # routing to it immediately; -t is the drain window for in-flight requests.
            if [ "$blue_up" -gt 0 ] || [ "$green_up" -gt 0 ]; then
              docker compose stop -t 35 "api-$live"
              echo "api-$live stopped (drained)"
            else
              echo "First deploy on this host — no previous colour to stop."
            fi
