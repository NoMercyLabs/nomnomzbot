# The public site at nomnomz.bot: the static Vue pages (home, "Coming soon" login, not-found), built from
# dashboard/ with `npm run build-site` and served by GitHub Pages. It is separate from ci.yml and never
# touches the dev box deploy. See docs/site-hosting.md.
name: Pages

on:
  push:
    branches: [master]
    paths:
      - 'dashboard/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A running deploy finishes; the next one waits its turn.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: dashboard/package.json
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build the site
        run: npm run build-site

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dashboard/dist-site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
