# Release channels. A release never builds: it copies a tag that CI already tested onto the next channel.
#
#   nightly  every night       latest (green master)  -> nightly
#   beta     every Monday      nightly                -> beta
#   stable   the Run button    beta                   -> stable
#
# Self-hosters pick a channel by image tag (ghcr.io/nomercylabs/nomnomzbot:stable|beta|nightly). Only stable
# writes a visible GitHub release (with notes since the last stable, and the self-contained lite binaries,
# §binaries job); nightly/beta mint a plain git tag so the releases page isn't flooded with pre-release noise.
# Use "Run workflow" for any channel.
name: Release

on:
  schedule:
    - cron: '0 3 * * *'   # nightly
    - cron: '0 4 * * 1'   # beta, Monday
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to release
        type: choice
        options: [stable, beta, nightly]
        default: stable

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  promote:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.ch.outputs.channel }}
      version: ${{ steps.tag.outputs.version }}
      sha: ${{ steps.src.outputs.sha }}
    steps:
      - name: Pick the channel
        id: ch
        run: |
          set -eu
          channel="${{ inputs.channel }}"
          if [ -z "$channel" ]; then
            if [ "${{ github.event.schedule }}" = "0 4 * * 1" ]; then channel=beta; else channel=nightly; fi
          fi
          case "$channel" in
            nightly) from=latest ;;
            beta) from=nightly ;;
            stable) from=beta ;;
          esac
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "from=$from" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Find the commit behind the source tag
        id: src
        run: |
          set -eu
          image="ghcr.io/${{ github.repository }}"
          image="${image,,}"
          src="${image}:${{ steps.ch.outputs.from }}"
          sha=$(docker buildx imagetools inspect "$src" --format '{{json .Image}}' \
            | jq -r '(if has("config") then . else (to_entries[0].value) end).config.Labels["org.opencontainers.image.revision"]')
          [ -n "$sha" ] && [ "$sha" != "null" ] || { echo "no revision label on $src" >&2; exit 1; }
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "${{ steps.ch.outputs.from }} is $sha"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip when nothing changed
        id: same
        run: |
          set -eu
          last=$(git tag --list "${{ steps.ch.outputs.channel }}-*" --sort=-creatordate | head -1)
          if [ -n "$last" ] && [ "$(git rev-list -n1 "$last")" = "${{ steps.src.outputs.sha }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.ch.outputs.channel }} already has ${{ steps.src.outputs.sha }} ($last)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "last=$last" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag the image
        if: steps.same.outputs.skip == 'false'
        id: tag
        run: |
          set -eu
          ch="${{ steps.ch.outputs.channel }}"
          version="${ch}-$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          image="${{ steps.src.outputs.image }}"
          docker buildx imagetools create -t "${image}:${ch}" -t "${image}:${version}" \
            "${image}:${{ steps.ch.outputs.from }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Nightly/beta only need the git tag the "Skip when nothing changed" dedup reads back next run — a
      # full Release row for every nightly/beta would flood the releases page with entries nobody pins to.
      - name: Tag nightly/beta (no release page entry)
        if: steps.same.outputs.skip == 'false' && steps.ch.outputs.channel != 'stable'
        run: |
          set -eu
          version="${{ steps.tag.outputs.version }}"
          sha="${{ steps.src.outputs.sha }}"
          git tag "$version" "$sha"
          git push origin "$version"

      - name: Write the stable GitHub release
        if: steps.same.outputs.skip == 'false' && steps.ch.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          ch="${{ steps.ch.outputs.channel }}"
          version="${{ steps.tag.outputs.version }}"
          sha="${{ steps.src.outputs.sha }}"
          last="${{ steps.same.outputs.last }}"
          range="$sha"
          [ -n "$last" ] && range="${last}..${sha}"
          {
            echo "Image: \`ghcr.io/nomercylabs/nomnomzbot:${ch}\` (also \`:${version}\`)"
            echo
            echo "## Update"
            echo
            echo "- **Docker, full stack:** set \`API_IMAGE=ghcr.io/nomercylabs/nomnomzbot:${ch}\` in \`.env\`, then run"
            echo "  \`scripts/switchover.ps1\`. The new version starts next to the old one; no downtime."
            echo "- **Docker, lite:** \`docker compose -f docker-compose.lite.yml pull && docker compose -f docker-compose.lite.yml up -d\`."
            echo "- **No Docker:** download the single-file binary for your OS below, and run it."
            echo "- Your data stays in place. Pin \`:${version}\` instead to stay on exactly this release."
            echo
            echo "## Changes"
            git log --no-merges --format='- %s (%h)' "$range" | head -200
          } > notes.md
          gh release create "$version" --target "$sha" --title "$version" --notes-file notes.md --latest

  # The hosted server runs stable only, so only a new stable release reaches it.
  deploy:
    needs: promote
    if: needs.promote.outputs.channel == 'stable' && needs.promote.outputs.version != ''
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.promote.outputs.version }}
    secrets: inherit

  # Self-contained, single-file, per-OS binaries for self_host_lite (deployment-distribution.md §1.1) — no
  # Docker, no .NET runtime install. Stable only: nightly/beta ship as images for iteration, not as downloads
  # someone runs on their own machine.
  binaries:
    needs: promote
    if: needs.promote.outputs.channel == 'stable' && needs.promote.outputs.version != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, linux-x64, linux-arm64, osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.promote.outputs.sha }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Publish the self-contained binary
        run: |
          set -eu
          dotnet publish server/src/NomNomzBot.Api -c Release -r ${{ matrix.rid }} \
            --self-contained true -p:BundleDashboard=true

      - name: Package the archive
        id: pkg
        run: |
          set -eu
          version="${{ needs.promote.outputs.version }}"
          rid="${{ matrix.rid }}"
          publish="server/src/NomNomzBot.Api/bin/Release/net10.0/${rid}/publish"
          stage="nomnomz-${version}-${rid}"
          mkdir -p "$stage"
          if [[ "$rid" == win-* ]]; then
            cp "$publish/nomnomz.exe" "$stage/"
            name="${stage}.zip"
            zip -qr "$name" "$stage"
          else
            cp "$publish/nomnomz" "$stage/"
            name="${stage}.tar.gz"
            tar -czf "$name" "$stage"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Attach to the stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.promote.outputs.version }}" "${{ steps.pkg.outputs.name }}" --clobber
