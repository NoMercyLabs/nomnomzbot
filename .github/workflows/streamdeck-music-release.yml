name: Stream Deck plugin release (Music)

# Separate from ci.yml on purpose: the plugin is versioned independently of the
# backend/frontend and must not fire on every master push. Tag push only.
on:
  push:
    tags:
      - 'streamdeck-music-v*'

defaults:
  run:
    working-directory: tools/streamdeck

jobs:
  release:
    name: Build & publish .streamDeckPlugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tools/streamdeck/package-lock.json

      - name: Install dependencies (workspace root)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck -w music

      - name: Test
        run: npm run test -w music

      - name: Build plugin bundle
        run: npm run build -w music

      # A .streamDeckPlugin file IS the .sdPlugin folder zipped with that
      # extension — same package installs on both Windows and macOS by
      # double-click; Elgato ships no Linux Stream Deck app to target.
      - name: Package .streamDeckPlugin
        working-directory: tools/streamdeck/music
        run: |
          set -e
          PLUGIN_DIR="bot.nomnomzbot.streamdeck.music.sdPlugin"
          OUT="bot.nomnomzbot.streamdeck.music.streamDeckPlugin"
          zip -r -X "$OUT" "$PLUGIN_DIR" -x '*.map'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: tools/streamdeck/music/bot.nomnomzbot.streamdeck.music.streamDeckPlugin
          name: Stream Deck plugin (Music) ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            NomNomzBot Stream Deck plugin (Music) — Spotify/music control over the bot's own Automation API.

            **Install (Windows & macOS):** download `bot.nomnomzbot.streamdeck.music.streamDeckPlugin` below and double-click it — the Stream Deck app installs it directly. Requires Stream Deck software 6.5+.

            **Linux:** Elgato does not ship an official Stream Deck app for Linux, so this plugin can't be installed there. Community projects (e.g. `streamdeck-linux-gui`) reimplement a Stream Deck client and may load third-party plugins, but they are unofficial, not built or tested by NoMercy Labs, and compatibility isn't guaranteed.
