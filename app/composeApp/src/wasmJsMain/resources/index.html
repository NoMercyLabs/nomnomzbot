<html lang="en">
<head>
    <meta charset="UTF-8">
    <!--
      viewport-fit=cover lets the page paint into the notch/home-indicator area; the safe-area padding below
      keeps content out of it. Zoom is deliberately NOT disabled (no maximum-scale / user-scalable=no) - a
      dashboard someone cannot pinch-zoom is a dashboard some people cannot read.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>NomNomzBot</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            /*
              100dvh, not 100%: on a mobile browser the visible viewport shrinks and grows as the URL bar
              collapses, and a percentage height resolves against the LARGER one - so the bottom of the app
              sits behind the browser chrome and its controls cannot be tapped. dvh tracks the viewport that
              is actually visible. The vh line before it is the fallback for anything without dvh support.
            */
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #0a0a0a;
            /* Keep content clear of the notch and the home indicator (paired with viewport-fit=cover). */
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            box-sizing: border-box;
            /*
              The app owns its own scrolling. Without this a vertical drag inside a list also drags the page
              itself on iOS, so a list rubber-bands the whole dashboard instead of scrolling.
            */
            overscroll-behavior: none;
            -webkit-text-size-adjust: 100%;
        }

        canvas {
            /* Let Compose see multi-touch and drags rather than the browser claiming them for panning/zoom. */
            touch-action: none;
        }

        /*
          Boot + recovery overlay. Shown immediately (before the wasm module loads) so the operator never sees a
          blank page, and torn down the moment Compose renders its first frame (window.__nnzAppReady). If the app
          never becomes ready (wasm or its resource bundle unreachable — e.g. the API is mid-restart / 502) or an
          uncaught crash occurs, it offers a Reload instead of freezing. This is the "never a frozen page" guard.
        */
        #nnz-boot {
            position: fixed;
            inset: 0;
            z-index: 2147483647;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            color: #e5e5e5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #nnz-boot .nnz-card {
            text-align: center;
            max-width: 340px;
            padding: 24px;
        }

        #nnz-boot .nnz-spinner {
            width: 34px;
            height: 34px;
            margin: 0 auto 18px;
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-top-color: #a970ff;
            border-radius: 50%;
            animation: nnz-spin 0.8s linear infinite;
        }

        @keyframes nnz-spin {
            to { transform: rotate(360deg); }
        }

        #nnz-boot .nnz-title {
            font-size: 15px;
            font-weight: 600;
        }

        #nnz-boot .nnz-sub {
            font-size: 13px;
            color: #a3a3a3;
            margin-top: 8px;
            line-height: 1.45;
        }

        #nnz-boot button {
            margin-top: 18px;
            padding: 9px 18px;
            font-size: 13px;
            font-weight: 600;
            color: #ffffff;
            background: #772ce8;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #nnz-boot button:hover {
            background: #6420d6;
        }
    </style>
    <!--
      Display-language override hook. The Compose/Wasm app publishes the operator's forced UI language
      to window.__customLocale; this makes navigator.languages return it so Compose resources resolve
      against the chosen language. When unset (System default) the browser's own locale is used.
    -->
    <script src="nnz-locale.js"></script>
    <!--
      Boot + recovery guard. Defined BEFORE composeApp.js so window.__nnzAppReady exists when the app first
      renders, and so uncaught crashes during load are caught. The page must never sit frozen: either the app
      renders (overlay hidden), or the operator is offered a reload.
    -->
    <script src="nnz-boot.js"></script>
</head>
<body>
<div id="nnz-boot" role="status" aria-live="polite">
    <div class="nnz-card">
        <div class="nnz-spinner" id="nnz-boot-spinner"></div>
        <div class="nnz-title" id="nnz-boot-title">Loading NomNomzBot&hellip;</div>
        <div class="nnz-sub" id="nnz-boot-sub"></div>
        <button type="button" id="nnz-boot-reload" style="display:none">Reload</button>
    </div>
</div>
<script src="composeApp.js"></script>
</body>
</html>
