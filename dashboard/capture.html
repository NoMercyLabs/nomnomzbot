<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <style>
      html {
        background: oklch(0.177638 0 0);

        height: 100vh;

    <title>NomNomzBot showcase capture</title>
  </head>
  <body>
    <div id="capture"></div>
    <script type="module" src="/src/views/site/home/preview/capture.ts"></script>
