# The public bot (stable tag) as its own stack: a blue/green API pair, Postgres and Redis, with its own data:
#
#   CHANNEL=stable docker compose -p nnz-stable --env-file stable.env -f docker-compose.channel.yml up -d
#
# deploy-channel.sh does exactly this and swaps the colours with no gap. The stack publishes no host port.
# The edge Caddy of the main stack (port 5080) routes each channel's hostname to its API by container name,
# so only the API containers join that network (`edge`). Postgres and Redis stay on the channel's own network
# and are addressed by their unique container names, so no channel can reach another channel's data.

x-api: &api
  image: ghcr.io/nomercylabs/nomnomzbot:${CHANNEL:?set CHANNEL}
  environment:
    - ASPNETCORE_ENVIRONMENT=Production
    - ASPNETCORE_URLS=http://+:5000
    - Deployment__Mode=${DEPLOYMENT_MODE:-self_host_full}
    - ConnectionStrings__DefaultConnection=Host=nnz-${CHANNEL}-postgres;Port=5432;Database=nomnomzbot;Username=nomnomzbot;Password=${POSTGRES_PASSWORD:?};MaxPoolSize=20
    - ConnectionStrings__Redis=nnz-${CHANNEL}-redis:6379,password=${REDIS_PASSWORD:?}
    - Jwt__Secret=${JWT_SECRET:?}
    - Jwt__Issuer=nomnomzbot-${CHANNEL}
    - Jwt__Audience=nomnomzbot-${CHANNEL}
    - Encryption__Key=${ENCRYPTION_KEY:?}
    - App__BaseUrl=${API_BASE_URL:?}
    - App__InitialAdminTwitchId=${INITIAL_ADMIN_TWITCH_ID:-}
    - ForwardedHeaders__KnownNetworks__0=172.16.0.0/12
    - Cors__Origins__0=${API_BASE_URL}
    - Twitch__ClientId=${TWITCH_CLIENT_ID:-}
    - Twitch__ClientSecret=${TWITCH_CLIENT_SECRET:-}
    - Twitch__BotUsername=${TWITCH_BOT_USERNAME:-}
    # A conduit belongs to one Twitch app. The main stack owns it, so a channel stack keeps to WebSocket EventSub.
    - EventSub__Conduits__Enabled=false
    - Spotify__ClientId=${SPOTIFY_CLIENT_ID:-}
    - Spotify__ClientSecret=${SPOTIFY_CLIENT_SECRET:-}
    - Discord__ClientId=${DISCORD_CLIENT_ID:-}
    - Discord__ClientSecret=${DISCORD_CLIENT_SECRET:-}
    - Api__ExposeDocs=false
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "curl -f http://localhost:5000/health/live || exit 1"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 30s
  restart: unless-stopped
  volumes:
    - api_data:/app/data
  networks:
    - channel
    - edge

services:
  api-blue:
    <<: *api
    container_name: nnz-${CHANNEL}-api-blue

  # Profiled so a bare `up -d` starts only blue; deploy-channel.sh addresses green explicitly.
  api-green:
    <<: *api
    container_name: nnz-${CHANNEL}-api-green
    profiles: ["green"]

  postgres:
    image: postgres:16-alpine
    container_name: nnz-${CHANNEL}-postgres
    environment:
      POSTGRES_DB: nomnomzbot
      POSTGRES_USER: nomnomzbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nomnomzbot -d nomnomzbot"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - channel

  redis:
    image: redis:7-alpine
    container_name: nnz-${CHANNEL}-redis
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - channel

volumes:
  postgres_data:
  api_data:

networks:
  channel:
    driver: bridge
  # The main stack's network, where its Caddy lives.
  edge:
    external: true
    name: nomnomzbot_nomnomzbot
