<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v3/sdpi-components.js"></script>
    <script src="shared.js"></script>
  </head>
  <body>
    <!-- Every action except pairing/host setup (the plugin's own settings.html, reached from the
         Stream Deck app's Plugins list — streamdeck-plugin.md P6) uses this PI: just the per-key
         color picker. -->
    <div id="appearance"></div>
    <script>
      document.addEventListener("pi:ready", (ev) => {
        initBackgroundColorPicker(document.getElementById("appearance"), ev.detail);
      });
    </script>
  </body>
</html>
