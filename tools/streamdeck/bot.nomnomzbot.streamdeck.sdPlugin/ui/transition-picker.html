<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v3/sdpi-components.js"></script>
    <script src="shared.js"></script>
  </head>
  <body>
    <!-- obs_transition (S-STREAMDECK-OBS-REMAINDER): set the current transition and/or fire a
         studio-mode transition. The transition dropdown is optional — leave it on "(unchanged)" to
         only fire the studio transition with whatever transition is already active. -->
    <sdpi-item label="Transition">
      <sdpi-select id="transition" placeholder="Loading transitions…"></sdpi-select>
    </sdpi-item>
    <sdpi-item label="Trigger studio transition">
      <sdpi-select id="studio">
        <option value="false">No</option>
        <option value="true">Yes</option>
      </sdpi-select>
    </sdpi-item>
    <sdpi-item label="Duration override (ms, optional)">
      <sdpi-textfield id="durationMs" type="number"></sdpi-textfield>
    </sdpi-item>
    <div id="appearance"></div>
    <script>
      document.addEventListener("pi:ready", (ev) => {
        initBackgroundColorPicker(document.getElementById("appearance"), ev.detail);
        requestFromPlugin({ type: "listSceneTransitions" });
        document.getElementById("studio").value = ev.detail.studio ? "true" : "false";
        if (ev.detail.durationMs) document.getElementById("durationMs").value = ev.detail.durationMs;
      });
      document.addEventListener("pi:message", (ev) => {
        if (ev.detail?.type !== "transitions") return;
        const select = document.getElementById("transition");
        select.innerHTML = "";
        const unchanged = document.createElement("option");
        unchanged.value = "";
        unchanged.textContent = "(unchanged)";
        select.appendChild(unchanged);
        for (const transition of ev.detail.transitions) {
          const option = document.createElement("option");
          option.value = transition.name;
          option.textContent = transition.isCurrent ? `${transition.name} (current)` : transition.name;
          select.appendChild(option);
        }
        select.value = piActionInfo.payload?.settings?.transition ?? "";
      });
      document.getElementById("transition").addEventListener("change", (ev) => {
        setSettings({ transition: ev.target.value });
      });
      document.getElementById("studio").addEventListener("change", (ev) => {
        setSettings({ studio: ev.target.value === "true" });
      });
      document.getElementById("durationMs").addEventListener("change", (ev) => {
        setSettings({ durationMs: Number(ev.target.value) });
      });
    </script>
  </body>
</html>
